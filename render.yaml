# Render Blueprint for the Samaritan API (free plan). Secrets are not stored here: Render asks for every `sync: false`
# value when the Blueprint is created, and they stay in the Render dashboard.
services:
  - type: web
    name: samaritan-api
    runtime: docker
    plan: free
    region: singapore # closest free region to Mumbai; the database is in Supabase ap-south-1
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: STORAGE_BACKEND, value: supabase }
      - { key: SUPABASE_BUCKET, value: call-audio }
      - { key: DATABASE_URL, sync: false } # Supabase Session pooler string
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: GNANI_API_KEY, sync: false }
      - { key: GNANI_BASE_URL, value: "https://api.vachana.ai" }
      - { key: GNANI_MODEL, value: prisma-v3.0 }
      - { key: GNANI_LANG_HINGLISH, value: "hi-IN,en-IN" }
      - { key: GNANI_LANG_MARATHI, value: "mr-IN,en-IN" }
      - { key: GNANI_FORMAT, value: transcribe }
      - { key: GNANI_WITH_DENOISE, value: "false" }
      - { key: GNANI_POLL_SECONDS, value: "10" }
      - { key: GNANI_MAX_CONCURRENT, value: "1" }
      - { key: LLM_PROVIDER, value: groq }
      - { key: LLM_FALLBACK_PROVIDER, value: gemini }
      - { key: GROQ_API_KEY, sync: false }
      - { key: GROQ_MODEL, value: openai/gpt-oss-120b }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GEMINI_MODEL, value: gemini-3.5-flash }
      - { key: LLM_RPM_LIMIT, value: "30" }
      - { key: LLM_TPM_LIMIT, value: "8000" }
      - { key: LLM_CACHE, value: "on" }
      - { key: MAX_UPLOAD_MB, value: "25" }
      - { key: MAX_CALL_MINUTES, value: "8" }
      - { key: DEMO_MODE, value: "true" }
      - { key: UPLOAD_PASSCODE, sync: false } # the passcode visitors type to upload or retry
      - { key: ADMIN_TOKEN, sync: false }
      - { key: CORS_ORIGINS, sync: false } # the Vercel URL, e.g. https://samaritan.vercel.app (no trailing slash)
      - { key: WORKER_ENABLED, value: "true" }
