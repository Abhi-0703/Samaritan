  - { text: "भोसड़ी", lang: both, strength: strong }
  - { text: "chutiya", lang: both, strength: strong }
  - { text: "chutiye", lang: both, strength: strong }
  - { text: "चूतिया", lang: both, strength: strong }
  - { text: "gandu", lang: both, strength: strong }
  - { text: "गांडू", lang: both, strength: strong }
  - { text: "randi", lang: both, strength: strong }
  - { text: "रंडी", lang: both, strength: strong }
